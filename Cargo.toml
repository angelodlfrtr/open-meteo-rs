[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
homepage = "https://github.com/angelodlfrtr/open-meteo-rs"
license = "MIT"
repository = "https://github.com/angelodlfrtr/open-meteo-rs"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4.31", default-features = false }
chrono-tz = "0.10.4"
futures = "0.3.25"
percent-encoding = { version = "2.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0.91", default-features = false }
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.24.2", default-features = false }
