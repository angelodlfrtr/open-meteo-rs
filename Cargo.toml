[package]
name = "open-meteo-rs"
version = "0.1.0"
edition = "2021"
homepage = "https://github.com/angelodlfrtr/open-meteo-rs"
license-file = "LICENSE.txt"
repository = "https://github.com/angelodlfrtr/open-meteo-rs"
description = "HTTP client for open-meteo.com api"

[features]
default = []
# Expose a synchronous client under `open_meteo_rs::blocking`.
blocking = ["reqwest/blocking"]

[dependencies]
chrono = { version = "0.4.24", features = ["serde"] }
chrono-tz = "0.8.2"
reqwest = { version = "0.11.14", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.91"
snafu = "0.7.4"

[dev-dependencies]
futures = "0.3.25"
tokio = { version = "1.24.2", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "blocking"
required-features = ["blocking"]

[package.metadata.docs.rs]
all-features = true
