name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@2c9db80fb984ceb1bcaa77cdda3fdf8cfba92035 # v34

      - name: Lint the workflow, flake, spelling and dependencies
        run: nix develop --command make lint

      - name: Run fmt check
        run: nix develop --command make fmt-check

      - name: Run clippy checks
        run: nix develop --command make clippy

      - name: Run tests
        run: nix develop --command make test

      - name: Check the core builds without std
        run: nix develop --command make check-no-std

      - name: Check line coverage is 100%
        run: nix develop --command make coverage

      - name: Build the API docs with warnings denied
        run: nix develop --command make doc
